<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="850" height="160" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="50%" stop-color="#ff8c2e"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .grid-dot { fill: #161b22; rx: 2px; }
    .grid-active-1 { fill: #1a2744; rx: 2px; }
    .grid-active-2 { fill: #2a437a; rx: 2px; }
    .grid-active-3 { fill: #3a62b5; rx: 2px; }
    .grid-active-4 { fill: #ff8c2e; rx: 2px; }
    .pulse-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #8b949e; letter-spacing: 2px; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg)" rx="8" stroke="#ff8c2e" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Mini contribution grid representation -->
  <g transform="translate(30, 25)">
    <!-- Week columns -->
    <g opacity="0.85">
      <rect x="0" y="0" width="10" height="10" class="grid-dot"/>
      <rect x="0" y="14" width="10" height="10" class="grid-active-1"/>
      <rect x="0" y="28" width="10" height="10" class="grid-dot"/>
      <rect x="0" y="42" width="10" height="10" class="grid-active-2"/>
      <rect x="0" y="56" width="10" height="10" class="grid-dot"/>
      <rect x="0" y="70" width="10" height="10" class="grid-dot"/>
      <rect x="0" y="84" width="10" height="10" class="grid-active-1"/>

      <rect x="14" y="0" width="10" height="10" class="grid-active-1"/>
      <rect x="14" y="14" width="10" height="10" class="grid-active-2"/>
      <rect x="14" y="28" width="10" height="10" class="grid-active-3"/>
      <rect x="14" y="42" width="10" height="10" class="grid-active-1"/>
      <rect x="14" y="56" width="10" height="10" class="grid-dot"/>
      <rect x="14" y="70" width="10" height="10" class="grid-active-2"/>
      <rect x="14" y="84" width="10" height="10" class="grid-dot"/>

      <rect x="28" y="0" width="10" height="10" class="grid-dot"/>
      <rect x="28" y="14" width="10" height="10" class="grid-active-3"/>
      <rect x="28" y="28" width="10" height="10" class="grid-active-4"/>
      <rect x="28" y="42" width="10" height="10" class="grid-active-3"/>
      <rect x="28" y="56" width="10" height="10" class="grid-active-2"/>
      <rect x="28" y="70" width="10" height="10" class="grid-active-1"/>
      <rect x="28" y="84" width="10" height="10" class="grid-dot"/>
    </g>

    <!-- Animated Snake Body Path -->
    <path d="M 50 42 Q 150 10, 260 50 T 450 70 T 620 30 T 760 56" fill="none" stroke="url(#snakeGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 6" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Snake Head -->
    <circle cx="760" cy="56" r="6" fill="#ffd166" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Status text -->
  <text x="425" y="140" text-anchor="middle" class="pulse-text">⚡ NEURAL SNAKE · SYNCHRONIZING REAL-TIME CALENDAR</text>
</svg>
