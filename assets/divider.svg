<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="1200" height="30">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c2e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff8c2e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffb37a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ff8c2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff8c2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c2e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff8c2e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5b8cff" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#ff8c2e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff8c2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base line -->
  <line x1="60" y1="15" x2="1140" y2="15" stroke="url(#lineGrad)" stroke-width="1"/>
  <!-- Center diamond -->
  <polygon points="600,8 607,15 600,22 593,15" fill="#ff8c2e" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <!-- Scanner beam -->
  <rect x="-150" y="12" width="150" height="6" rx="3" fill="url(#scanGrad)" opacity="0.5">
    <animate attributeName="x" from="-150" to="1200" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Left dot -->
  <circle cx="60" cy="15" r="2" fill="#5b8cff" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Right dot -->
  <circle cx="1140" cy="15" r="2" fill="#5b8cff" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
